<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Supprimer un membre</title>
</head>

<body>

    <h1>Supprimer un membre</h1>

    <p>
        Voulez-vous vraiment supprimer le membre
        {{ membre.nom }} ?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Confirmer la suppression
        </button>

    </form>

    <a href="{% url 'liste_membres' %}">
        Annuler
    </a>

</body>

</html>

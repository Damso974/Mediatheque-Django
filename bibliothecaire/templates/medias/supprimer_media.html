<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer un média</title>
</head>
<body>

    <h1>Supprimer un média</h1>

    <p>
        Voulez-vous vraiment supprimer :
        {{ media.titre }} ?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Confirmer la suppression
        </button>

    </form>

    <a href="{% url 'liste_medias_bibliothecaire' %}">
        Annuler
    </a>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Ajouter un média</title>
</head>

<body>

    <h1>Ajouter un média</h1>

    <p>Type sélectionné : {{ type_media }}</p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Ajouter
        </button>

    </form>

    <a href="{% url 'creer_media' %}">
        Changer de type
    </a>

    <br>

    <a href="{% url 'liste_medias_bibliothecaire' %}">
        Annuler
    </a>

</body>

</html>

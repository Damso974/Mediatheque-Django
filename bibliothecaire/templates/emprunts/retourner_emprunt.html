<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Retour d'un média</title>
</head>

<body>

    <h1>Retour d'un média</h1>

    <p>
        Membre : {{ emprunt.membre }}
    </p>

    <p>
        Média : {{ emprunt.media }}
    </p>

    <p>
        Confirmer le retour de ce média ?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Confirmer le retour
        </button>

    </form>

    <a href="{% url 'liste_emprunts' %}">
        Annuler
    </a>

</body>

</html>
